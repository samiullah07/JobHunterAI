[project]
name = "jobhunter"
version = "0.1.0"
description = "Autonomous, human-in-the-loop AI job-hunting agent"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.118",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.11",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.43",
  "alembic>=1.14",
  "asyncpg>=0.30",
  "redis>=5.2",
  "celery>=5.4",
  "httpx>=0.28",
  "langgraph>=0.6.8",
  "langchain-core>=0.3.78",
  "openai>=1.0",
  "fastembed>=0.4",
  "playwright>=1.49",
  "structlog>=24.4",
  "tenacity>=9.0",
  "python-dotenv>=1.0",
  "streamlit>=1.51",
  "jinja2>=3.1",
  "python-docx>=1.1",
  "pypdf>=5.0",
  "pgvector>=0.3",
  "pydantic[email]>=2.11",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "testcontainers>=4.8",
  "psycopg2-binary>=2.9",
  "pre-commit>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "TID"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: tests requiring external services (Docker, DB)",
  "slow: tests that are slow (e.g. Playwright PDF rendering)",
]
filterwarnings = [
  "error::sqlalchemy.exc.SAWarning",
  "ignore::DeprecationWarning:starlette",
  "ignore::DeprecationWarning:testcontainers",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobhunter"]